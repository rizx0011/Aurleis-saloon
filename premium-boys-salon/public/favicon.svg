<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <!-- Luxury Gold Linear Gradient -->
    <linearGradient id="goldFoil" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8C96E"/>
      <stop offset="35%" stop-color="#C9A227"/>
      <stop offset="70%" stop-color="#B88A1A"/>
      <stop offset="100%" stop-color="#8F670A"/>
    </linearGradient>
    <!-- Background Squircle Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF8F0"/>
      <stop offset="100%" stop-color="#F2EADB"/>
    </linearGradient>
    <!-- Drop Shadow Filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#8F670A" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Squircle with Subtle Gold Border -->
  <rect x="3" y="3" width="114" height="114" rx="26" fill="url(#bgGrad)" stroke="url(#goldFoil)" stroke-width="3"/>

  <!-- Logo Group -->
  <g filter="url(#goldGlow)" transform="translate(10, 8)">
    <!-- Crown at Top -->
    <path d="M 36 28 L 42 16 L 50 24 L 58 16 L 64 28 Z" fill="url(#goldFoil)" stroke="url(#goldFoil)" stroke-width="1.5" stroke-linejoin="round"/>
    <circle cx="42" cy="14" r="2" fill="url(#goldFoil)"/>
    <circle cx="50" cy="22" r="2" fill="url(#goldFoil)"/>
    <circle cx="58" cy="14" r="2" fill="url(#goldFoil)"/>

    <!-- Geometric Monogram "A" -->
    <path d="M 32 82 L 48 34 L 54 34 L 70 82 L 60 82 L 56 68 L 44 68 L 40 82 Z M 47 58 L 53 58 L 50 46 Z" fill="url(#goldFoil)"/>

    <!-- Elegant Barber Shears Crossing Right Leg -->
    <g transform="translate(56, 42) rotate(18)">
      <!-- Blade 1 -->
      <path d="M 0 0 L 4 -28 L 7 -28 L 3 0 Z" fill="url(#goldFoil)"/>
      <!-- Blade 2 -->
      <path d="M 3 0 L 7 -28 L 10 -28 L 6 0 Z" fill="url(#goldFoil)"/>
      <!-- Pivot screw -->
      <circle cx="3" cy="2" r="2.5" fill="#FFFFFF" stroke="url(#goldFoil)" stroke-width="1"/>
      <!-- Left finger ring -->
      <circle cx="-4" cy="18" r="6" fill="none" stroke="url(#goldFoil)" stroke-width="3"/>
      <!-- Right finger ring with tang -->
      <circle cx="10" cy="16" r="6" fill="none" stroke="url(#goldFoil)" stroke-width="3"/>
      <path d="M 16 14 Q 20 12 22 8" fill="none" stroke="url(#goldFoil)" stroke-width="2" stroke-linecap="round"/>
    </g>
  </g>
</svg>
